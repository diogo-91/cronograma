<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>Cronograma</title>
  <link rel="icon" href="img/icone-goldsystem.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-tela="carregando">
  <header class="topo">
    <div class="marca">
      <img class="marca-logo" src="img/logo-goldsystem.png" alt="GoldSystem" width="806" height="120">
    </div>
    <div class="topo-titulo">
      <div class="empresa-linha">
        <input id="titulo" class="titulo" type="text" maxlength="80" aria-label="Nome da empresa" autocomplete="off">
        <details class="menu menu-empresas" id="menu-empresas">
          <summary class="btn btn-empresas" title="Trocar de empresa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/></svg><span>Empresas</span></summary>
          <div class="menu-itens">
            <div class="menu-rotulo">Empresas</div>
            <div id="lista-empresas" class="lista-empresas"></div>
            <hr>
            <button type="button" id="btn-nova-empresa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nova empresa</button>
          </div>
        </details>
      </div>
      <span class="salvo" id="salvo">Salvo no servidor</span>
    </div>
    <div class="topo-acoes">
      <details class="menu" id="menu">
        <summary class="btn" aria-label="Opções do arquivo">Arquivo</summary>
        <div class="menu-itens">
          <button type="button" data-acao="exportar-json"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Exportar backup (JSON)</button>
          <button type="button" data-acao="importar-json"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>Importar backup (JSON)</button>
          <button type="button" data-acao="exportar-csv"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>Exportar para Excel (CSV)</button>
          <button type="button" data-acao="imprimir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/></svg>Imprimir / salvar PDF</button>
          <hr>
          <button type="button" data-acao="exemplo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Carregar exemplo</button>
          <button type="button" data-acao="sair"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H4"/></svg>Sair</button>
          <button type="button" data-acao="apagar-tudo" class="perigo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>Apagar todas as atividades</button>
          <button type="button" data-acao="excluir-empresa" class="perigo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>Excluir esta empresa</button>
        </div>
      </details>
      <button type="button" class="btn primario btn-nova" id="btn-nova" aria-label="Nova atividade">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Nova atividade</span>
      </button>
    </div>
  </header>

  <section class="login" aria-labelledby="login-titulo">
    <form id="form-login" class="login-cartao">
      <img class="login-logo" src="img/logo-goldsystem.png" alt="GoldSystem" width="806" height="120">
      <h1 id="login-titulo">Entrar no cronograma</h1>
      <p class="dica">Digite a senha definida no servidor.</p>
      <label class="rotulo" for="senha">Senha</label>
      <input id="senha" name="senha" class="campo" type="password" autocomplete="current-password" required aria-describedby="erro-login">
      <p class="erro" id="erro-login" role="alert"></p>
      <button type="submit" class="btn primario">Entrar</button>
    </form>
  </section>

  <main class="conteudo">
    <section class="resumo" id="resumo" aria-label="Resumo do cronograma"></section>

    <section class="ferramentas" aria-label="Filtros e visualização">
      <div class="busca-caixa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="busca" class="campo busca" type="search" placeholder="Buscar atividade, fase, responsável…" aria-label="Buscar">
      </div>
      <select id="filtro-fase" class="campo" aria-label="Filtrar por fase"></select>
      <select id="filtro-status" class="campo" aria-label="Filtrar por status">
        <option value="">Todos os status</option>
        <option value="pendente">Não iniciada</option>
        <option value="andamento">Em andamento</option>
        <option value="atrasada">Atrasada</option>
        <option value="concluida">Concluída</option>
      </select>
      <div class="modos">
      <div class="segmentado" role="group" aria-label="Visualização">
        <button type="button" data-visao="gantt">Gantt</button>
        <button type="button" data-visao="tabela">Lista</button>
      </div>
      <div class="segmentado" role="group" aria-label="Escala do Gantt" id="grupo-zoom">
        <button type="button" data-zoom="dia">Dia</button>
        <button type="button" data-zoom="semana">Semana</button>
        <button type="button" data-zoom="mes">Mês</button>
        <button type="button" id="btn-hoje">Hoje</button>
      </div>
      </div>
    </section>

    <section id="vista-gantt" class="gantt" aria-label="Gráfico de Gantt" tabindex="0"></section>
    <section id="vista-tabela" class="lista" aria-label="Lista de atividades"></section>
    <section id="vazio" class="vazio" hidden></section>
  </main>

  <dialog id="dialogo-empresa" aria-labelledby="dialogo-empresa-titulo">
    <form id="form-empresa" novalidate>
      <header class="dialogo-topo">
        <h2 id="dialogo-empresa-titulo">Nova empresa</h2>
        <button type="button" class="btn-icone" data-fechar-empresa aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="dialogo-corpo">
        <label class="rotulo" for="f-empresa">Nome da empresa</label>
        <input id="f-empresa" name="nome" class="campo" type="text" maxlength="80" required autocomplete="off" aria-describedby="e-empresa">
        <p class="erro" id="e-empresa"></p>
      </div>
      <footer class="dialogo-rodape">
        <span class="espaco"></span>
        <button type="button" class="btn" data-fechar-empresa>Cancelar</button>
        <button type="submit" class="btn primario">Criar empresa</button>
      </footer>
    </form>
  </dialog>

  <dialog id="dialogo" aria-labelledby="dialogo-titulo">
    <form id="form-tarefa" novalidate>
      <header class="dialogo-topo">
        <h2 id="dialogo-titulo">Nova atividade</h2>
        <button type="button" class="btn-icone" data-fechar aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="dialogo-corpo">
        <label class="rotulo" for="f-nome">Atividade *</label>
        <input id="f-nome" name="nome" class="campo" type="text" maxlength="200" required autocomplete="off" aria-describedby="e-nome">
        <p class="erro" id="e-nome" data-erro="nome"></p>

        <div class="duas-colunas">
          <div>
            <label class="rotulo" for="f-fase">Fase / etapa</label>
            <input id="f-fase" name="fase" class="campo" type="text" maxlength="80" list="lista-fases" autocomplete="off">
          </div>
          <div>
            <label class="rotulo" for="f-responsavel">Responsável</label>
            <input id="f-responsavel" name="responsavel" class="campo" type="text" maxlength="80" list="lista-responsaveis" autocomplete="off">
          </div>
        </div>

        <div class="duas-colunas">
          <div>
            <label class="rotulo" for="f-inicio">Início *</label>
            <input id="f-inicio" name="inicio" class="campo" type="date" required aria-describedby="e-inicio">
            <p class="erro" id="e-inicio" data-erro="inicio"></p>
          </div>
          <div>
            <label class="rotulo" for="f-fim">Término *</label>
            <input id="f-fim" name="fim" class="campo" type="date" required aria-describedby="e-fim f-duracao">
            <p class="erro" id="e-fim" data-erro="fim"></p>
          </div>
        </div>
        <p class="dica" id="f-duracao"></p>

        <label class="rotulo" for="f-progresso">Progresso</label>
        <div class="progresso-campo">
          <input id="f-progresso-faixa" type="range" min="0" max="100" step="5" aria-label="Progresso (controle deslizante)">
          <div class="progresso-numero">
            <input id="f-progresso" name="progresso" class="campo" type="number" min="0" max="100" step="1" inputmode="numeric" aria-describedby="e-progresso">
            <span>%</span>
          </div>
        </div>
        <p class="erro" id="e-progresso" data-erro="progresso"></p>

        <span class="rotulo" id="rotulo-notas">Notas</span>
        <div class="editor">
          <div class="editor-barra" role="toolbar" aria-label="Formatação das notas">
            <button type="button" class="editor-botao" data-comando="bold" title="Negrito" aria-label="Negrito"><b>B</b></button>
            <button type="button" class="editor-botao" data-comando="italic" title="Itálico" aria-label="Itálico"><i>I</i></button>
            <button type="button" class="editor-botao" data-comando="underline" title="Sublinhado" aria-label="Sublinhado"><u>U</u></button>
            <span class="editor-separador"></span>
            <button type="button" class="editor-botao" data-comando="insertUnorderedList" title="Lista com marcadores" aria-label="Lista com marcadores"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
            <button type="button" class="editor-botao" data-comando="insertOrderedList" title="Lista numerada" aria-label="Lista numerada"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M4 5h1.5v4M4 9h3M4 14.5c0-.8.7-1.5 1.5-1.5S7 13.7 7 14.5c0 1.2-3 2-3 3.5h3"/></svg></button>
            <span class="editor-separador"></span>
            <button type="button" class="editor-botao" data-comando="removeFormat" title="Limpar formatação" aria-label="Limpar formatação"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12M12 5l-3 14M5 19l14-14"/></svg></button>
          </div>
          <div id="f-notas" class="editor-area" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="rotulo-notas" aria-describedby="e-notas" data-placeholder="Observações, combinados, links…"></div>
        </div>
        <p class="erro" id="e-notas" data-erro="notas"></p>

        <div class="checklist-topo">
          <span class="rotulo" id="rotulo-checklist">Checklist</span>
          <span class="dica" id="f-checklist-resumo"></span>
        </div>
        <ul id="f-checklist" class="checklist" aria-labelledby="rotulo-checklist"></ul>
        <button type="button" class="btn btn-pequeno" id="btn-item-checklist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Adicionar item</button>
        <p class="erro" id="e-checklist" data-erro="checklist"></p>
      </div>

      <footer class="dialogo-rodape">
        <button type="button" class="btn perigo-texto" id="btn-excluir">Excluir</button>
        <span class="espaco"></span>
        <button type="button" class="btn" data-fechar>Cancelar</button>
        <button type="submit" class="btn primario">Salvar</button>
      </footer>
    </form>
  </dialog>

  <datalist id="lista-fases"></datalist>
  <datalist id="lista-responsaveis"></datalist>
  <input type="file" id="arquivo" accept="application/json,.json" hidden>
  <div id="toast" class="toast" hidden></div>
  <div id="anuncio" class="so-leitor" role="status" aria-live="polite"></div>

  <script src="js/cronograma.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
